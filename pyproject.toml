[project]
name = "quantitative-trading-system"
version = "0.2.1"
description = "策略独立的量化底座 - 数据保留、显式策略、离线回放"
readme = "README.md"
# Preserve the existing environment while resetting application architecture.
# Dependency upgrades require passing the active infrastructure tests first.
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Quant Team"}
]
# 版本 == 精确锁定（基线=2026-10-30 环境，即原 requirements.lock.txt；
# 宽口径的教训见 §2.22——pandas>=1.4 曾可能装到 2.x。升级=显式改本表 + uv sync）
dependencies = [
    # --- 数据处理 ---
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pyarrow==25.0.1",        # data_cache parquet 引擎（pandas 隐式依赖，显式钉住）
    # --- 数据源 ---
    "akshare==1.18.97",       # 免费备用源；jqdatasdk 可选不在默认环境（jq_source 懒加载）
    "oracledb==26.0.1",       # Wind Oracle DB（thin 模式免装客户端）
    # --- 组合优化 / 研究 ---
    "cvxpy==1.9.3",           # portfolio/optimizer.py
    "scikit-learn==1.9.1",    # Retained for reproducible archived research.
    # --- Web / 运维 ---
    "Flask==3.1.3",
    "waitress==3.0.2",        # webapp serving（默认监听 127.0.0.1）
    "Markdown==3.10.3",
    "python-dotenv==1.2.3",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "matplotlib==3.11.2",
    "baostock>=0.9.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyflakes==4.1.0",        # F821 未定义名门槛（tests/test_no_undefined_names.py）
]

# 应用非库：uv 不安装项目自身（原 hatchling build-system 对平铺结构无法打包，已移除）
[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".venv", "data_cache", "runtime", "results", "ai-created"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "release_gate: 发布门槛测试（必须通过才能合并master）",
]
# 覆盖率改为显式开启（不阻塞测试可执行性）：
#   pytest --cov=. --cov-report=term-missing
