<title>每日交易报告</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #0f1420; color: #e5e7eb; padding: 20px; }
.container { max-width: 1080px; margin: 0 auto; }
h1 { font-size: 20px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
h1 .sub { font-size: 12px; color: #64748b; font-weight: 400; }
.nav { margin: 10px 0 16px; font-size: 13px; display: flex; gap: 18px; align-items: center; }
.nav a { color: #60a5fa; text-decoration: none; } .nav a:hover { text-decoration: underline; }
.card { background: #161d2e; border: 1px solid #263143; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.card h3 { font-size: 14px; color: #cbd5e1; margin-bottom: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { color: #94a3b8; text-align: left; padding: 8px 10px; border-bottom: 1px solid #263143; font-size: 12px; }
th.r, td.r { text-align: right; }
td { padding: 7px 10px; border-bottom: 1px solid #1d2637; color: #cbd5e1; }
tr:hover td { background: #1a2333; }
a { color: #60a5fa; text-decoration: none; } a:hover { text-decoration: underline; }
.pos { color: #f87171; } .neg { color: #34d399; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #1e293b; color: #93c5fd; }
.muted { color: #64748b; font-size: 12px; }
details summary { cursor: pointer; font-size: 14px; color: #cbd5e1; }
.empty { color: #64748b; text-align: center; padding: 24px; font-size: 13px; }
</style>
</head>
