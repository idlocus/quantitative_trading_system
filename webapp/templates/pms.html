<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMS · 组合管理</title>
<script src="/static/echarts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#0f1420;color:#e5e7eb;padding:20px}
.container{max-width:1280px;margin:0 auto}
h1{font-size:20px;color:#fff;display:flex;justify-content:space-between;align-items:center}
h1 .sub{font-size:12px;color:#64748b;font-weight:400}
.nav{margin:10px 0 16px;font-size:13px;display:flex;gap:18px;align-items:center}
.nav a{color:#60a5fa;text-decoration:none}.nav a:hover{text-decoration:underline}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab{padding:8px 20px;border-radius:8px 8px 0 0;background:#161d2e;color:#94a3b8;cursor:pointer;font-size:14px;border:1px solid #263143;border-bottom:none}
.tab.active{background:#1e293b;color:#fff;font-weight:600}
.panel{display:none;background:#161d2e;border:1px solid #263143;border-radius:0 10px 10px 10px;padding:18px}
.panel.active{display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.tile{background:#111827;border:1px solid #263143;border-radius:10px;padding:12px 14px}
.tile .k{font-size:11px;color:#94a3b8;margin-bottom:3px}
.tile .v{font-size:19px;font-weight:700;color:#fff}
.pos{color:#f87171!important}.neg{color:#34d399!important}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:#94a3b8;text-align:right;padding:8px 10px;border-bottom:1px solid #263143;cursor:pointer;white-space:nowrap}
th:hover{color:#e2e8f0}
th.l,td.l{text-align:left}
td{padding:7px 10px;text-align:right;border-bottom:1px solid #1d2637;color:#cbd5e1;white-space:nowrap}
tr:hover td{background:#1a2333}
.card{background:#111827;border:1px solid #263143;border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{font-size:13px;color:#cbd5e1;margin-bottom:10px}
#navChart{width:100%;height:260px}
#contribChart{width:100%;height:300px}
#cumChart{width:100%;height:300px}
.empty{color:#64748b;text-align:center;padding:40px;font-size:14px}
.sym{cursor:pointer;color:#93c5fd}.sym:hover{text-decoration:underline}
.badge{display:inline-block;background:#1e293b;color:#93c5fd;border-radius:5px;padding:1px 8px;font-size:11px}
.refresh{font-size:12px;color:#64748b}
</style>
</head>
<body>
<div class="container">
  <h1>PMS · 组合管理 <span class="sub" id="asOf">加载中…</span></h1>
  <div class="nav">
    <b>组合管理</b> · <a href="/strategy">策略回测</a> · <a href="/results">研究报告</a> · <a href="/research">研究仪表盘</a>
    <span class="refresh" id="refreshed"></span>
  </div>

  <div class="tabs">
    <div class="tab active" data-p="overview">总览</div>
    <div class="tab" data-p="positions">持仓</div>
    <div class="tab" data-p="trades">交易</div>
    <div class="tab" data-p="attr">归因</div>
  </div>

  <!-- 总览 -->
  <div class="panel active" id="p-overview">
    <div class="tiles" id="kpiTiles"></div>
    <div class="card"><h3>净值曲线</h3><div id="navChart"></div></div>
    <div class="card"><h3>持仓（按权重，点击列头排序）</h3>
      <div style="overflow:auto;max-height:420px"><table id="posTableOverview"></table></div>
    </div>
  </div>

  <!-- 持仓 -->
  <div class="panel" id="p-positions">
    <div class="card"><h3>全部持仓明细</h3>
      <div style="overflow:auto;max-height:640px"><table id="posTable"></table></div>
    </div>
  </div>

  <!-- 交易 -->
  <div class="panel" id="p-trades">
    <div class="card"><h3>成交记录（全部，最新在前）</h3>
      <div style="overflow:auto;max-height:640px"><table id="tradeTable"></table></div>
    </div>
  </div>

  <!-- 归因 -->
  <div class="panel" id="p-attr">
    <div class="card"><h3>当日个股贡献（红=盈利 绿=亏损，双击条目可跳个股）</h3><div id="contribChart"></div></div>
    <div class="card"><h3>累计持仓盈亏（红=盈利 绿=亏损）</h3><div id="cumChart"></div></div>
  </div>

<!-- 个股钻取弹窗 -->
<div id="symModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;overflow:auto;padding:30px">
  <div style="max-width:1000px;margin:0 auto;background:#161d2e;border:1px solid #263143;border-radius:12px;padding:20px">
    <div style="display:flex;justify-content:space-between;margin-bottom:12px">
      <h3 id="symTitle" style="color:#fff"></h3>
      <button onclick="document.getElementById('symModal').style.display='none'"
        style="background:#1e293b;color:#94a3b8;border:none;border-radius:6px;padding:6px 14px;cursor:pointer">关闭 ✕</button>
    </div>
    <div id="kInfo" style="font-size:12px;color:#94a3b8;margin-bottom:6px"></div>
    <div style="width:100%"><div id="kChart" style="width:100%;min-width:680px;height:420px"></div></div>
    <div id="symRationale" class="card" style="display:none;background:#111827;border:1px solid #263143;border-radius:10px;padding:14px;margin-top:14px"></div>
    <div style="margin-top:14px">
      <h4 style="color:#cbd5e1;font-size:13px;margin-bottom:8px">该股交易记录</h4>
      <div style="overflow:auto;max-height:200px"><table id="symTrades"></table></div>
    </div>
  </div>
</div>

</div>

<script>
let DATA = null;
const fmt = (v,d=0)=>Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = v=>(v*100).toFixed(2)+'%';
const cls = v=>v>=0?'pos':'neg';

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); document.getElementById('p-'+t.dataset.p).classList.add('active');
  if(t.dataset.p==='attr') renderAttr();
  window.dispatchEvent(new Event('resize'));
});

async function load(){
  const r = await fetch('/pms/api/data');
  if(!r.ok){document.getElementById('asOf').textContent='账本未找到';return;}
  DATA = await r.json();
  document.getElementById('asOf').textContent='数据截至 '+DATA.as_of+' 收盘（缓存价）';
  document.getElementById('refreshed').textContent='刷新于 '+new Date().toLocaleTimeString();
  renderKpi(); renderNav(); renderPosTables(); renderTrades();
}
function renderKpi(){
  const k=DATA.kpi;
  const tiles=[
    ['账户净值',fmt(k.nav)],['当日盈亏',fmt(k.day_pnl,0),cls(k.day_pnl)],
    ['累计盈亏',fmt(k.total_pnl,0),cls(k.total_pnl)],
    ['持仓数',k.n_positions],['现金',fmt(k.cash)],['累计成交',k.n_trades+' 笔']];
  document.getElementById('kpiTiles').innerHTML=tiles.map(t=>
    `<div class="tile"><div class="k">${t[0]}</div><div class="v ${t[2]||''}">${t[1]}</div></div>`).join('');
}
let NAV_CHART=null;
function renderNav(){
  const h=DATA.nav_history;
  if(!NAV_CHART){NAV_CHART=echarts.init(document.getElementById('navChart'));window.addEventListener('resize',()=>NAV_CHART&&NAV_CHART.resize());}
  const c=NAV_CHART;
  c.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis'},
    grid:{left:80,right:20,top:15,bottom:35},
    xAxis:{type:'category',data:h.map(x=>x.date),axisLabel:{color:'#64748b'}},
    yAxis:{type:'value',scale:true,axisLabel:{color:'#64748b',formatter:v=>fmt(v)},splitLine:{lineStyle:{color:'#1d2637'}}},
    series:[{type:'line',data:h.map(x=>x.nav),showSymbol:false,lineStyle:{width:2,color:'#60a5fa'},areaStyle:{opacity:0.08}}]});
  window.addEventListener('resize',()=>c.resize());
}
function posRows(data){
  return data.map(p=>`<tr>
    <td class="l"><b class="sym" onclick="showSymbol('${p.symbol}')">${p.symbol}</b></td><td>${fmt(p.qty)}</td><td>${p.cost.toFixed(2)}</td>
    <td>${p.price.toFixed(2)}</td><td class="${cls(p.day_chg)}">${p.day_chg>=0?'+':''}${pct(p.day_chg)}</td>
    <td class="${cls(p.pnl)}">${p.pnl>=0?'+':''}${fmt(p.pnl)}</td>
    <td>${pct(p.weight)}</td></tr>`).join('');
}
function renderPosTables(){
  const head=`<tr><th class="l">代码</th><th>数量</th><th>成本</th><th>现价</th><th>当日涨跌</th><th>持仓盈亏</th><th>权重</th></tr>`;
  document.getElementById('posTableOverview').innerHTML=head+posRows(DATA.positions);
  const t=document.getElementById('posTable');
  t.innerHTML=head+posRows(DATA.positions);
  [document.getElementById('posTableOverview'),t].forEach(tbl=>{
    tbl.querySelectorAll('th').forEach((th,i)=>th.onclick=()=>{
      const rows=Array.from(tbl.rows).slice(1);
      rows.sort((a,b)=>{const x=a.cells[i].innerText.replace(/[^0-9.+-]/g,''),y=b.cells[i].innerText.replace(/[^0-9.+-]/g,'');
        return (parseFloat(x)||0)<(parseFloat(y)||0)?1:-1;});
      rows.forEach(r=>tbl.appendChild(r));});
  });
}
function renderTrades(){
  const t=DATA.trades;
  if(!t.length){document.getElementById('tradeTable').innerHTML='<tr><td class="empty">暂无成交</td></tr>';return;}
  document.getElementById('tradeTable').innerHTML=`<tr><th class="l">日期</th><th class="l">代码</th><th class="l">方向</th>
    <th>价格</th><th>数量</th><th>佣金</th><th>税费</th><th class="l">交易逻辑</th></tr>`+
    t.map(x=>`<tr><td class="l">${(x.time||x.date).replace('T',' ')}</td><td class="l"><b class="sym" onclick="showSymbol('${x.symbol}')">${x.symbol}</b></td>
    <td class="l"><span class="badge" style="color:${x.side==='BUY'?'#f87171':'#34d399'}">${x.side==='BUY'?'买入':'卖出'}</span></td>
    <td>${x.price.toFixed(2)}</td><td>${fmt(x.quantity)}</td><td>${x.commission.toFixed(2)}</td><td>${x.taxes.toFixed(2)}</td><td class="l" style="color:#94a3b8">${x.note||'首期建仓 · 详见于个股详情'}</td></tr>`).join('');
}
function renderAttr(){
  const day=[...DATA.positions].sort((a,b)=>a.day_contrib-b.day_contrib);
  const top=day.slice(-10), bot=day.slice(0,10);
  const cats=[...new Set([...bot.map(x=>x.symbol),...top.map(x=>x.symbol)])];
  const vals=cats.map(s=>({...day.find(x=>x.symbol===s)}).day_contrib||0);
  const c=echarts.init(document.getElementById('contribChart'));
  c.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis'},
    grid:{left:90,right:30,top:10,bottom:30},
    xAxis:{type:'value',axisLabel:{color:'#64748b'},splitLine:{lineStyle:{color:'#1d2637'}}},
    yAxis:{type:'category',data:cats,axisLabel:{color:'#94a3b8',formatter:v=>v}},
    series:[{type:'bar',data:vals.map(v=>({value:v,itemStyle:{color:v>=0?'#ef4444':'#22c55e'}})),barWidth:'60%'}]});
  c.off('click'); c.on('click',e=>{const s=cats[e.dataIndex];if(s)showSymbol(s);});
  const cum=[...DATA.positions].sort((a,b)=>a.pnl-b.pnl);
  const cc=echarts.init(document.getElementById('cumChart'));
  cc.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis'},
    grid:{left:90,right:30,top:10,bottom:30},
    xAxis:{type:'value',axisLabel:{color:'#64748b'},splitLine:{lineStyle:{color:'#1d2637'}}},
    yAxis:{type:'category',data:cum.map(x=>x.symbol),axisLabel:{color:'#94a3b8'}},
    series:[{type:'bar',data:cum.map(x=>({value:x.pnl,itemStyle:{color:x.pnl>=0?'#ef4444':'#22c55e'}})),barWidth:'60%'}]});
  window.addEventListener('resize',()=>{c.resize();cc.resize();});
}

load();
setInterval(load, 60000);  // 每分钟自动刷新
</script>
<script src="/static/pms_symbol.js?v=4"></script>
</body>
</html>
